<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<title>Katalog Produk | Valora</title>
<link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-page="katalog" data-root="../">
<div id="navbar"></div>
<main class="section">
  <div class="container">
    <h1 class="page-title">Katalog Produk</h1>
    <form class="catalog-search" id="searchForm" role="search">
      <label for="searchInput" class="sr-only">Cari produk berdasarkan nama</label>
      <input type="search" id="searchInput" placeholder="Cari nama produk, misalnya Tas Kuliah" autocomplete="off">
    </form>
    <div class="chips" id="categoryChips" role="group" aria-label="Filter kategori"></div>
    <p class="result-info" id="resultInfo" aria-live="polite"></p>
    <div class="product-grid" id="productGrid"></div>
  </div>
</main>
<div id="footer"></div>
<script src="../js/products.js"></script><script src="../js/storage.js"></script><script src="../js/cart.js"></script><script src="../js/ui.js"></script><script src="../js/search.js"></script><script src="../js/product-detail.js"></script><script src="../js/app.js"></script>
</body>
</html>
